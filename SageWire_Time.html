<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire Time</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f5f7fa; color: #263238; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header-brand { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #00897b; padding-bottom: 15px; }
        .header-brand h1 { color: #00897b; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .header-brand p { color: #546e7a; margin: 5px 0 0; font-style: italic; font-size: 0.9em; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .dash-card { background: #e0f2f1; border-radius: 8px; padding: 15px; text-align: center; border-top: 4px solid #00897b; }
        .dash-label { font-size: 0.7em; color: #00695c; text-transform: uppercase; font-weight: bold; }
        .dash-value { font-size: 1.4em; font-weight: 900; color: #004d40; display: block; margin-top: 5px; }

        /* Timer Box */
        .display-container { background: #263238; color: white; border-radius: 10px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .timer-display { font-size: 3.5em; font-weight: 900; font-family: monospace; line-height: 1; }
        .money-display { font-size: 1.5em; color: #69f0ae; font-weight: bold; margin-top: 10px; }
        .status-badge { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; color: #b0bec5; margin-bottom: 5px; display: block; }

        /* Inputs */
        .input-row { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        input { padding: 10px; border: 1px solid #cfd8dc; border-radius: 6px; width: 100px; text-align: center; }
        label { font-size: 0.8rem; font-weight: bold; color: #b0bec5; display: block; margin-bottom: 4px;}

        /* Buttons */
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; color: white; }
        #btn-in { background: #2e7d32; }
        #btn-pause { background: #f9a825; color: black; }
        #btn-out { background: #c62828; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Mileage Section */
        .mileage-box { background: #eceff1; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .mileage-label { font-weight: bold; color: #455a64; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <h1>SageWire TIME</h1>
        <p>Shift & Mileage Tracker</p>
    </div>

    <div class="dashboard-grid">
        <div class="dash-card">
            <span class="dash-label">Weekly Hours</span>
            <span class="dash-value" id="val-hours">0.0</span>
        </div>
        <div class="dash-card">
            <span class="dash-label">Est. Earnings</span>
            <span class="dash-value" id="val-earn">$0</span>
        </div>
    </div>

    <div class="display-container">
        <span class="status-badge" id="status-badge">OFF CLOCK</span>
        <div class="timer-display" id="main-timer">00:00:00</div>
        <div class="money-display" id="money-display">$0.00</div>

        <div class="input-row">
            <div>
                <label>Hourly ($)</label>
                <input type="number" id="hourly-rate" value="0" placeholder="0.00">
            </div>
            <div>
                <label>Mile Rate ($)</label>
                <input type="number" id="mile-rate" value="0.67" placeholder="0.67">
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-in" onclick="markIn()">Start</button>
        <button id="btn-pause" onclick="togglePause()" disabled>Pause</button>
        <button id="btn-out" onclick="markOut()" disabled>End</button>
    </div>

    <div class="mileage-box">
        <span class="mileage-label">🚗 MILES DRIVEN (This Shift):</span>
        <input type="number" id="miles-driven" placeholder="0" style="width:80px; background:white;">
    </div>

    <div style="text-align:center;">
        <button onclick="exportCSV()" style="background:#546e7a; width:100%; padding:12px;">💾 Export Log (CSV)</button>
        <button onclick="clearHistory()" style="background:transparent; color:#e53935; border:1px solid #e53935; margin-top:10px; width:100%; padding:8px;">Reset All Data</button>
    </div>
</div>

<script>
    let startTime, accumulated = 0, timerInt, isRunning = false;
    const history = JSON.parse(localStorage.getItem('sage_time_history')) || [];
    
    // Elements
    const elTimer = document.getElementById('main-timer');
    const elMoney = document.getElementById('money-display');
    const elStatus = document.getElementById('status-badge');
    
    // Init Dashboard
    updateDashboard();

    function markIn() {
        startTime = Date.now();
        accumulated = 0;
        isRunning = true;
        updateUI();
        timerInt = setInterval(tick, 1000);
    }

    function togglePause() {
        if(isRunning) { // Pause
            clearInterval(timerInt);
            accumulated += Date.now() - startTime;
            isRunning = false;
            elStatus.innerText = "PAUSED";
        } else { // Resume
            startTime = Date.now();
            isRunning = true;
            timerInt = setInterval(tick, 1000);
            updateUI();
        }
    }

    function markOut() {
        clearInterval(timerInt);
        const endMs = accumulated + (isRunning ? (Date.now() - startTime) : 0);
        
        // Calcs
        const rate = parseFloat(document.getElementById('hourly-rate').value) || 0;
        const miles = parseFloat(document.getElementById('miles-driven').value) || 0;
        const mileRate = parseFloat(document.getElementById('mile-rate').value) || 0;
        
        const timePay = (endMs / 3600000) * rate;
        const milePay = miles * mileRate;
        const total = timePay + milePay;

        // Save
        const record = {
            date: new Date().toLocaleDateString(),
            duration: (endMs / 3600000).toFixed(2),
            miles: miles,
            totalPay: total.toFixed(2)
        };
        history.push(record);
        localStorage.setItem('sage_time_history', JSON.stringify(history));

        // Reset
        isRunning = false; accumulated = 0;
        document.getElementById('miles-driven').value = '';
        elTimer.innerText = "00:00:00";
        elMoney.innerText = "$0.00";
        updateUI();
        updateDashboard();
        alert(`Shift Ended. Earned: $${total.toFixed(2)}`);
    }

    function tick() {
        const ms = accumulated + (Date.now() - startTime);
        const sec = Math.floor((ms / 1000) % 60).toString().padStart(2,'0');
        const min = Math.floor((ms / 60000) % 60).toString().padStart(2,'0');
        const hr = Math.floor(ms / 3600000).toString().padStart(2,'0');
        elTimer.innerText = `${hr}:${min}:${sec}`;
        
        const rate = parseFloat(document.getElementById('hourly-rate').value) || 0;
        elMoney.innerText = "$" + ((ms/3600000)*rate).toFixed(2);
    }

    function updateUI() {
        document.getElementById('btn-in').disabled = isRunning;
        document.getElementById('btn-pause').disabled = false;
        document.getElementById('btn-out').disabled = false;
        elStatus.innerText = isRunning ? "ON CLOCK" : "OFF CLOCK";
    }

    function updateDashboard() {
        let h = 0, m = 0;
        history.forEach(r => { h += parseFloat(r.duration); m += parseFloat(r.totalPay); });
        document.getElementById('val-hours').innerText = h.toFixed(1);
        document.getElementById('val-earn').innerText = "$" + m.toFixed(0);
    }

    function exportCSV() {
        let csv = "Date,Hours,Miles,Total Earned\n";
        history.forEach(r => csv += `${r.date},${r.duration},${r.miles},${r.totalPay}\n`);
        const link = document.createElement("a");
        link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
        link.download = "SageWire_Time_Log.csv";
        link.click();
    }
    
    function clearHistory() {
        if(confirm("Delete all logs?")) {
            localStorage.removeItem('sage_time_history');
            location.reload();
        }
    }
</script>
</body>
</html>
