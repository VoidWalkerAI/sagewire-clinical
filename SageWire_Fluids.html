<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire Drips</title>
    <style>
        body { background: #e0f7fa; font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .header { background: #00acc1; color: white; padding: 15px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .warning { font-size: 0.7rem; color: #555; margin-bottom: 20px; font-style: italic; text-align: center; }
        
        label { font-weight: bold; color: #006064; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 15px; font-size: 1.1rem; border: 1px solid #4dd0e1; border-radius: 8px; background: white; }
        
        button { background: #00acc1; color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 25px; }
        
        .result-box { margin-top: 30px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; text-align: center; }
        .result-val { font-size: 3rem; font-weight: 900; color: #006064; }
        .result-sub { font-size: 1rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">DRIP RATE CALCULATOR</div>
    <div class="warning">⚠️ Educational Aid Only. Verify with MD.</div>

    <label>Total Volume (mL)</label>
    <input type="number" id="vol" placeholder="e.g. 1000">

    <label>Time (Hours)</label>
    <input type="number" id="hours" placeholder="e.g. 8">

    <label>Tubing Drop Factor (gtt/mL)</label>
    <select id="gtt">
        <option value="10">10 (Macro)</option>
        <option value="15">15 (Standard)</option>
        <option value="20">20 (Standard)</option>
        <option value="60">60 (Micro/Peds)</option>
    </select>

    <button onclick="calcDrip()">CALCULATE RATE</button>

    <div class="result-box" id="result">
        <div>SET PUMP TO:</div>
        <div class="result-val" id="rate">-- gtt/min</div>
        <div class="result-sub" id="flow">-- mL/hr</div>
    </div>

<script>
    function calcDrip() {
        const vol = parseFloat(document.getElementById('vol').value);
        const hrs = parseFloat(document.getElementById('hours').value);
        const factor = parseFloat(document.getElementById('gtt').value);

        if(!vol || !hrs) return;

        // Flow rate (mL/hr)
        const flowRate = vol / hrs;
        
        // Drops per minute = (mL/hr * drop factor) / 60
        const gttMin = Math.round((flowRate * factor) / 60);

        document.getElementById('result').style.display = 'block';
        document.getElementById('rate').innerText = gttMin + " gtt/min";
        document.getElementById('flow').innerText = "(" + Math.round(flowRate) + " mL/hr)";
    }
</script>
</body>
</html>
