<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire MAP</title>
    <style>
        body { background: #e0f2f1; font-family: sans-serif; padding: 20px; text-align: center; }
        .header { background: #00695c; color: white; padding: 15px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        input { width: 45%; padding: 15px; font-size: 1.2rem; text-align: center; border: 2px solid #00695c; border-radius: 8px; }
        button { background: #00695c; color: white; border: none; padding: 15px 30px; font-size: 1rem; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; }
        .result-box { margin-top: 30px; padding: 20px; border-radius: 10px; display: none; }
        .big-num { font-size: 4rem; font-weight: 900; margin: 10px 0; }
        .status { font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="header">MAP CALCULATOR</div>
    
    <div class="input-row">
        <input type="number" id="sys" placeholder="Systolic (Top)">
        <input type="number" id="dia" placeholder="Diastolic (Bot)">
    </div>

    <button onclick="calcMAP()">CALCULATE MAP</button>

    <div class="result-box" id="result">
        <div>Mean Arterial Pressure:</div>
        <div class="big-num" id="mapVal">--</div>
        <div class="status" id="mapStatus">--</div>
        <div style="font-size:0.8rem; margin-top:10px;">Goal is > 65 for organ perfusion</div>
    </div>

<script>
    function calcMAP() {
        const s = parseFloat(document.getElementById('sys').value);
        const d = parseFloat(document.getElementById('dia').value);
        if(!s || !d) return;

        // MAP = (SBP + 2*DBP) / 3
        const map = Math.round((s + (2 * d)) / 3);
        
        const box = document.getElementById('result');
        const val = document.getElementById('mapVal');
        const stat = document.getElementById('mapStatus');

        box.style.display = 'block';
        val.innerText = map;

        if(map >= 65) {
            box.style.background = "#c8e6c9"; // Green
            box.style.color = "#1b5e20";
            stat.innerText = "PERFUSION: GOOD ✅";
        } else {
            box.style.background = "#ffcdd2"; // Red
            box.style.color = "#b71c1c";
            stat.innerText = "PERFUSION: POOR ⚠️";
        }
    }
</script>
</body>
</html>
