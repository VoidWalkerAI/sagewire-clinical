<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire Dose</title>
    <style>
        body { background: #f3e5f5; font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .header { background: #8e24aa; color: white; padding: 15px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .warning { font-size: 0.7rem; color: #555; margin-bottom: 20px; font-style: italic; text-align: center; }
        
        label { font-weight: bold; color: #6a1b9a; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 15px; font-size: 1.1rem; border: 1px solid #ce93d8; border-radius: 8px; background: white; }
        
        button { background: #8e24aa; color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 25px; }
        
        .result-box { margin-top: 30px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; text-align: center; }
        .result-val { font-size: 2.5rem; font-weight: 900; color: #4a148c; }
        .result-sub { font-size: 1rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">DOSAGE CALCULATOR</div>
    <div class="warning">⚠️ Educational Aid Only. Verify with Pharmacy.</div>

    <label>Patient Weight</label>
    <div style="display:flex; gap:10px;">
        <input type="number" id="weight" placeholder="e.g. 70" style="flex:2;">
        <select id="unit" style="flex:1;">
            <option value="kg">kg</option>
            <option value="lb">lbs</option>
        </select>
    </div>

    <label>Ordered Dose (mg/kg)</label>
    <input type="number" id="dosePerKg" placeholder="e.g. 5">

    <label>Drug Concentration (mg/mL)</label>
    <input type="number" id="conc" placeholder="e.g. 10">

    <button onclick="calcDose()">CALCULATE DOSE</button>

    <div class="result-box" id="result">
        <div>GIVE THIS AMOUNT:</div>
        <div class="result-val" id="finalVol">-- mL</div>
        <div class="result-sub" id="finalMg">-- mg Total</div>
    </div>

<script>
    function calcDose() {
        let weight = parseFloat(document.getElementById('weight').value);
        const unit = document.getElementById('unit').value;
        const doseKg = parseFloat(document.getElementById('dosePerKg').value);
        const conc = parseFloat(document.getElementById('conc').value);

        if(!weight || !doseKg || !conc) return;

        // Convert lbs to kg if needed
        if(unit === "lb") weight = weight / 2.20462;

        const totalMg = weight * doseKg;
        const totalMl = totalMg / conc;

        document.getElementById('result').style.display = 'block';
        document.getElementById('finalVol').innerText = totalMl.toFixed(1) + " mL";
        document.getElementById('finalMg').innerText = "(" + totalMg.toFixed(0) + " mg)";
    }
</script>
</body>
</html>
