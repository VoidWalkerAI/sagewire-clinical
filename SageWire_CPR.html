<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire CPR</title>
    <style>
        body { background: #ffebee; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { background: #d32f2f; color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; }
        .timer-display { font-size: 6rem; font-weight: bold; color: #b71c1c; margin-top: 50px; }
        .cycle-count { font-size: 1.5rem; color: #555; margin-bottom: 30px; }
        .btn-container { margin-top: auto; padding: 20px; display: flex; gap: 10px; }
        button { flex: 1; padding: 20px; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .btn-start { background: #d32f2f; color: white; }
        .btn-stop { background: #455a64; color: white; }
        .pulse-check { background: #ffeb3b; color: black; position: absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; justify-content:center; align-items:center; font-size:3rem; font-weight:900; animation: flash 0.5s infinite; }
        @keyframes flash { 0% {opacity:1;} 50% {opacity:0;} 100% {opacity:1;} }
    </style>
</head>
<body>
    <div class="header">CODE BLUE ASSIST</div>
    <div class="timer-display" id="time">02:00</div>
    <div class="cycle-count">CYCLE: <span id="cycle">1</span></div>
    
    <div class="pulse-check" id="alertScreen" onclick="resetCycle()">
        <div>PULSE CHECK!</div>
        <div style="font-size:1.5rem; margin-top:20px;">(Tap to Continue)</div>
    </div>

    <div class="btn-container">
        <button class="btn-stop" onclick="stopTimer()">STOP</button>
        <button class="btn-start" onclick="startTimer()">START</button>
    </div>

<script>
    let time = 120; // 2 minutes
    let running = false;
    let cycle = 1;
    let interval;

    function startTimer() {
        if(running) return;
        running = true;
        interval = setInterval(() => {
            time--;
            updateDisplay();
            if(time <= 0) {
                document.getElementById('alertScreen').style.display = 'flex';
                // Beep Logic would go here
                stopTimer();
            }
        }, 1000);
    }

    function stopTimer() {
        running = false;
        clearInterval(interval);
    }

    function resetCycle() {
        document.getElementById('alertScreen').style.display = 'none';
        time = 120;
        cycle++;
        document.getElementById('cycle').innerText = cycle;
        updateDisplay();
        startTimer();
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        document.getElementById('time').innerText = 
            `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
</script>
</body>
</html>
