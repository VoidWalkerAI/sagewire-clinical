<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire CPR v2</title>
    <style>
        body { background: #ffebee; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        
        .header { background: #d32f2f; color: white; padding: 15px; font-weight: 900; font-size: 1.5rem; letter-spacing: 1px; }
        
        /* The Big Timer */
        .timer-display { font-size: 7rem; font-weight: 900; color: #b71c1c; margin-top: 40px; font-variant-numeric: tabular-nums; }
        .cycle-count { font-size: 1.5rem; color: #555; margin-bottom: 30px; font-weight: bold; }
        
        /* Buttons */
        .btn-container { margin-top: auto; padding: 20px; display: flex; gap: 10px; height: 120px; }
        button { flex: 1; border: none; border-radius: 10px; font-size: 1.5rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-start { background: #d32f2f; color: white; box-shadow: 0 4px 0 #b71c1c; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        .btn-stop { background: #455a64; color: white; max-width: 100px; box-shadow: 0 4px 0 #263238; }
        .btn-stop:active { transform: translateY(4px); box-shadow: none; }

        /* The "Pulse Check" Overlay */
        .pulse-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #ffeb3b; color: black; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 999; cursor: pointer;
        }
        .pulse-title { font-size: 4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        .pulse-sub { font-size: 1.5rem; font-weight: bold; animation: blink 1s infinite; background: black; color: #ffeb3b; padding: 10px 20px; border-radius: 50px; }
        
        @keyframes blink { 0% {opacity:1;} 50% {opacity:0.3;} 100% {opacity:1;} }
    </style>
</head>
<body>

    <div class="header">CODE BLUE ASSIST</div>
    
    <div class="timer-display" id="time">02:00</div>
    <div class="cycle-count">CYCLE: <span id="cycle">1</span></div>
    
    <div class="pulse-overlay" id="alertScreen" onclick="resetCycle()">
        <div class="pulse-title">SWITCH!</div>
        <div class="pulse-sub">TAP SCREEN TO RESUME</div>
    </div>

    <div class="btn-container">
        <button class="btn-stop" onclick="stopTimer()">Stop</button>
        <button class="btn-start" onclick="startTimer()">START CPR</button>
    </div>

<script>
    let time = 120; // 2 minutes
    let running = false;
    let cycle = 1;
    let interval;
    let audioCtx; // The Synthesizer

    function startTimer() {
        if(running) return;
        
        // Unlock Audio Engine on first click (Required by browsers)
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        running = true;
        
        interval = setInterval(() => {
            time--;
            updateDisplay();
            
            // Warning Beeps at 10 seconds left
            if(time <= 10 && time > 0) beep(400, 100); 

            if(time <= 0) {
                stopTimer();
                triggerAlarm();
            }
        }, 1000);
    }

    function stopTimer() {
        running = false;
        clearInterval(interval);
    }

    function triggerAlarm() {
        // Show Flash Screen
        document.getElementById('alertScreen').style.display = 'flex';
        
        // Play Triple Loud Beep
        beep(800, 300);
        setTimeout(() => beep(800, 300), 400);
        setTimeout(() => beep(800, 600), 800);
    }

    function resetCycle() {
        // Hide Screen
        document.getElementById('alertScreen').style.display = 'none';
        // Reset Logic
        time = 120;
        cycle++;
        document.getElementById('cycle').innerText = cycle;
        updateDisplay();
        // Auto-Start Next Round
        startTimer();
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        document.getElementById('time').innerText = 
            `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // --- THE SYNTHESIZER (Makes sound without files) ---
    function beep(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.frequency.value = freq;
        osc.type = 'square'; // Nasty loud sound
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        setTimeout(() => osc.stop(), duration);
    }
</script>
</body>
</html>
