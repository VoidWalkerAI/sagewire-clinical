<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SageWire Clinical | Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --col-bg: #f5f7fa;
            --col-text: #263238;
            --col-sub: #546e7a;
            --font-main: 'Inter', sans-serif;

            /* DEPT COLORS */
            --cardio: #00897b;
            --resp: #0277bd;
            --neuro: #673ab7;
            --gi: #2e7d32;
            --ortho: #455a64;
            --skin: #e53935;
            --pharma: #8e24aa; /* Purple for Meds */
            --fluids: #00acc1; /* Cyan for Fluids */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--col-bg);
            color: var(--col-text);
            font-family: var(--font-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- HERO HEADER --- */
        .hero {
            background: white;
            padding: 40px 20px 30px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .hero h1 {
            margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: -1px;
            color: #1a237e;
        }
        .hero p {
            margin: 10px 0 0 0; color: var(--col-sub); font-size: 0.95rem;
        }

        /* --- GRID --- */
        .grid-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 600px; margin: 0 auto; width: 100%;
        }

        /* --- SECTION TITLE --- */
        .section-label {
            grid-column: 1 / -1;
            font-size: 0.75rem; font-weight: 800; color: #90a4ae;
            text-transform: uppercase; letter-spacing: 1px;
            margin-top: 20px; margin-bottom: 5px;
        }
        .section-label:first-child { margin-top: 0; }

        /* --- DEPT BUTTONS --- */
        .dept-btn {
            background: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 130px;
            position: relative;
            overflow: hidden;
        }
        .dept-btn:active { transform: scale(0.96); }

        /* Colored top bar for each card */
        .dept-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
        }

        .dept-icon {
            font-size: 2rem; margin-bottom: 8px;
        }
        .dept-name {
            font-weight: 800; font-size: 0.95rem; color: var(--col-text);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .dept-desc {
            font-size: 0.7rem; color: #90a4ae; margin-top: 4px; font-weight: 600;
        }

        /* Specific Colors */
        .btn-cardio::before { background: var(--cardio); }
        .btn-cardio .dept-icon { color: var(--cardio); }

        .btn-resp::before { background: var(--resp); }
        .btn-resp .dept-icon { color: var(--resp); }

        .btn-neuro::before { background: var(--neuro); }
        .btn-neuro .dept-icon { color: var(--neuro); }

        .btn-gi::before { background: var(--gi); }
        .btn-gi .dept-icon { color: var(--gi); }

        .btn-ortho::before { background: var(--ortho); }
        .btn-ortho .dept-icon { color: var(--ortho); }

        .btn-skin::before { background: var(--skin); }
        .btn-skin .dept-icon { color: var(--skin); }

        .btn-pharma::before { background: var(--pharma); }
        .btn-pharma .dept-icon { color: var(--pharma); }

        .btn-fluids::before { background: var(--fluids); }
        .btn-fluids .dept-icon { color: var(--fluids); }


        /* --- FOOTER --- */
        .footer {
            text-align: center; padding: 30px 20px; color: #b0bec5; font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <div class="hero">
        <h1>SAGEWIRE CLINICAL</h1>
        <p>The Digital Preceptor</p>
    </div>

    <div class="grid-container">
        
        <div class="section-label">Translations</div>

        <a href="SageWire_Cardio.html" class="dept-btn btn-cardio">
            <div class="dept-icon">🫀</div>
            <div class="dept-name">Cardio</div>
            <div class="dept-desc">The Pump</div>
        </a>

        <a href="SageWire_Resp.html" class="dept-btn btn-resp">
            <div class="dept-icon">🫁</div>
            <div class="dept-name">Respiratory</div>
            <div class="dept-desc">The Bellows</div>
        </a>

        <a href="SageWire_Neuro.html" class="dept-btn btn-neuro">
            <div class="dept-icon">🧠</div>
            <div class="dept-name">Neuro</div>
            <div class="dept-desc">The Wiring</div>
        </a>

        <a href="SageWire_GI.html" class="dept-btn btn-gi">
            <div class="dept-icon">🥨</div>
            <div class="dept-name">G.I.</div>
            <div class="dept-desc">The Plumbing</div>
        </a>

        <a href="SageWire_Ortho.html" class="dept-btn btn-ortho">
            <div class="dept-icon">🦴</div>
            <div class="dept-name">Ortho</div>
            <div class="dept-desc">The Frame</div>
        </a>

        <a href="SageWire_Skin.html" class="dept-btn btn-skin">
            <div class="dept-icon">🛡️</div>
            <div class="dept-name">Skin</div>
            <div class="dept-desc">The Armor</div>
        </a>

        <div class="section-label">Calculators</div>

        <a href="SageWire_Pharma.html" class="dept-btn btn-pharma">
            <div class="dept-icon">💊</div>
            <div class="dept-name">Pharma</div>
            <div class="dept-desc">Dose Calc</div>
        </a>

        <a href="SageWire_Fluids.html" class="dept-btn btn-fluids">
            <div class="dept-icon">💧</div>
            <div class="dept-name">Fluids</div>
            <div class="dept-desc">Drip Rate</div>
        </a>

    </div>

    <div class="footer">
        SageWire Scholastic Tool v1.1<br>
        Forged for the Modern Student
    </div>

</body>
</html>
